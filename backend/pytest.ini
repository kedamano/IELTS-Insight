[pytest]
# rootdir = backend/；conftest.py 在仓库根的 backend 目录下，先装隔离再 import app.*
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -p no:cacheprovider：pytest 会在 rootdir 写 .pytest_cache，而 conftest 把 CWD 切到了 tmp，
#                      相对路径写入会失败（不是错误，但会污染输出）。
# -m "not integration"：默认绝不跑真实网络/AI（CONSTITUTION §5）；跑法：RUN_INTEGRATION=1 python -m pytest -m integration
# --import-mode=importlib：允许 backend/conftest.py 与 tests/conftest.py 同名不冲突
addopts = -q -p no:cacheprovider --import-mode=importlib -m "not integration" --strict-markers -ra

markers =
    integration: 需要真实网络/真实 LLM 凭据的验收用例，默认排除，必须 RUN_INTEGRATION=1 显式开启

filterwarnings =
    ignore:.*on_event.*:DeprecationWarning
    ignore:.*The event_loop.*:DeprecationWarning
