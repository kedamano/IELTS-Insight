[package]
name = "ielts-insight"
version = "2.0.0"
description = "IELTS Insight — 个人雅思备考桌面应用（听说读写四科 + AI 评分）"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# The `_up_` in the produced exe name comes from `productName`; Tauri lowercases/
# slugifies it to `ielts-insight`. Keep the binary name aligned with the package.
[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
tauri = { version = "2", features = ["config-json5"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 启动结论要落盘（契约 §15.4 第 6 条）：时间戳必须与后端 faultlog 同一个本地时区口径。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
